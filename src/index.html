<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 카카오톡</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#20251e;background:#f4f5ef;font-size:15px}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer;border:1px solid #d8ddd1;background:white;border-radius:10px;padding:10px 15px;color:inherit}button:hover{background:#f1f4e9}button:disabled{opacity:.45;cursor:default}.primary{background:#e6f173;border-color:#d6e460;font-weight:650}.primary:hover{background:#dbe958}.danger{color:#a23d32}.muted{color:#74806d}.tag{font-size:12px;padding:5px 9px;background:#edf0e5;border-radius:6px;white-space:nowrap}.tag.green{background:#e5edce;color:#47601e}.tag.warn{background:#fff0d3;color:#8b610d}header{padding:28px 36px 24px;border-bottom:1px solid #dfe3d5;background:#fafbf6;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;font-weight:720;letter-spacing:-.7px;margin:0 0 8px}h2{font-size:16px;margin:0}p{line-height:1.6}.subtitle{font-size:13px;color:#707a66}.head-right{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 112px)}aside{border-right:1px solid #dfe3d5;padding:25px 20px}.aside-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}input{width:100%;border:1px solid #dfe3d5;background:#fafbf7;padding:11px;border-radius:9px;outline:none;margin-bottom:12px}.chat{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 12px;margin-bottom:3px}.chat.active{background:#e6eccf}.chat .name{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat small{display:block;color:#7c856f;margin-top:5px}.chat .unread{float:right;font-size:11px;background:#dbe88f;padding:2px 6px;border-radius:12px}main{padding:30px 35px;min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.toolbar div{display:flex;gap:9px;align-items:center}.card{padding:23px;background:#fff;border:1px solid #e0e5d6;border-radius:16px;margin-bottom:18px;box-shadow:0 3px 12px #31421804}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.card h3{font-size:17px;margin:0}.original{margin:16px 0;padding:14px 16px;background:#f4f6ef;border-radius:10px;font-size:14px;white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}.summary{font-size:14px;color:#505b45}.label{font-size:12px;color:#7e886e;margin:17px 0 8px;display:block}.draft{width:100%;min-height:110px;padding:14px;border:1px solid #d4dfb7;background:#fcfdf8;border-radius:10px;resize:vertical;line-height:1.7;outline:none}.draft:focus{border-color:#92ac4a}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.actions>div{display:flex;gap:8px}.empty{padding:60px 15px;text-align:center;color:#738061}.empty .icon{font-size:30px;display:block;margin-bottom:15px;color:#8b9d63}.note{font-size:12px;color:#839073;line-height:1.6}.error{background:#fff0e8;border:1px solid #ecc9b5;padding:13px 16px;border-radius:10px;margin-bottom:18px;color:#8f4734;font-size:13px}.bubble{max-width:85%;padding:12px 16px;background:#fff;border:1px solid #e0e5d6;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px}.bubble.mine{margin-left:auto;background:#edf2cc;border-color:#e0e7b2}.bubble .who{font-size:11px;color:#7d886c;margin-bottom:4px}.messages{margin-bottom:25px}.chat-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:transparent;color:#728057;padding:0}dialog{width:min(520px,90vw);border:1px solid #d9e2c5;border-radius:18px;padding:28px;box-shadow:0 25px 100px #17250d35}dialog::backdrop{background:#13200e66}dialog h3{margin:0 0 16px}#confirmText{white-space:pre-wrap;background:#f4f7eb;padding:18px;border-radius:10px;line-height:1.8}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2d3925;color:white;padding:13px 22px;border-radius:12px;z-index:10;display:none;max-width:85vw}footer{font-size:12px;color:#899278;margin-top:30px}a{color:#526d27}@media(max-width:800px){header{padding:20px;align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #dfe3d5;padding:18px}#chats{max-height:180px;overflow:auto}main{padding:24px 18px}.head-right{flex-wrap:wrap}.toolbar{align-items:flex-start}.card{padding:18px}.actions{align-items:flex-start;flex-direction:column}.bubble{max-width:95%}}
</style>
<header><div><h1>업무 카카오톡</h1><div class="subtitle">업무 계정 · 업무 계정의 메시지와 답장 초안</div></div><div class="head-right"><span id="connection" class="tag">연결 확인 중</span><button id="autoHeader" onclick="toggleAuto()">Codex 자동 초안</button><button id="pause" onclick="togglePause()">일시정지</button><button id="refresh" onclick="refresh()">새로고침</button></div></header>
<div class="layout"><aside><div class="aside-title"><h2>대화방</h2><span class="tag" id="roomCount">—</span></div><input id="search" placeholder="대화방 검색" aria-label="대화방 검색" oninput="renderChats()"><div id="chats"></div><p class="note">개인 카카오톡은 연결하지 않았습니다.<br>알림을 끈 대화방은 초안도 작성하지 않습니다.</p></aside>
<main><div id="error"></div><div id="content"></div><footer id="footer"></footer></main></div>
<dialog id="confirmDialog"><h3>이 내용으로 보낼까요?</h3><p id="confirmName"></p><div id="confirmText"></div><p class="note">아래 버튼을 누르면 업무 카카오톡으로 실제 전송합니다.</p><div class="actions"><button onclick="cancelSend()">취소</button><button class="primary" id="sendFinal" onclick="confirmSend()">이 내용으로 보내기</button></div></dialog>
<div id="toast" role="status"></div>
<script>
let status={},chats=[],inbox=[],selected=null,messages=[],prepared=null,edited={},busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=t=>t?new Date(typeof t==='number'?t*1000:t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const labels={received:'새 메시지',queued:'작성 대기',drafting:'초안 작성 중',host_queued:'Codex 작성 대기',dots_pending:'Dots 작성 대기',draft:'답장 초안',no_reply:'답장 필요 없음',draft_error:'초안 확인 필요',stale:'새 대화 확인 필요',sending:'발송 확인 중',sent:'발송 확인',send_uncertain:'카톡에서 발송 확인 필요',replied:'직접 답장 완료',dismissed:'확인 완료'};
async function api(path,body){const res=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Kakao-Bridge':'1'}:{},body:body?JSON.stringify(body):undefined});const d=await res.json();if(!res.ok)throw Error(d.error||'요청에 실패했습니다.');return d;}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',5000);}
async function refresh(){try{[status,chats,inbox]=await Promise.all([api('status'),api('chats'),api('inbox')]);$('connection').textContent=status.paused?'일시정지':status.connected?'업무 계정 연결됨':'연결 확인 필요';$('connection').className='tag '+(status.connected&&!status.paused?'green':'warn');$('pause').textContent=status.paused?'다시 시작':'일시정지';$('roomCount').textContent=chats.length;$('error').innerHTML=status.error?'<div class="error">'+esc(status.error)+'</div>':status.ai_error?'<div class="error">'+esc(status.ai_error)+'</div>':'';$('autoHeader').textContent=(status.dots?.connected?'Dots':'Codex')+' 자동 초안 '+(status.auto_draft?'켜짐':'꺼짐');$('footer').textContent='마지막 수신 확인 '+time(status.last_poll)+' · 새 메시지 알림 활성 · '+(status.dots?.connected?(status.auto_draft?'Dots 수신 이벤트 연결됨 · 새 메시지가 올 때만 초안을 준비합니다.':'자동 초안이 꺼져 있습니다.'):status.draft_mode==='codex'?'초안은 Codex 대화에서 작성합니다.':status.auto_draft?'이 대화의 Codex가 초안을 자동으로 준비합니다.':'자동 초안이 꺼져 있습니다.');renderChats();if(!document.querySelector('textarea:focus')&&!$('confirmDialog').open&&!busy){if(selected)messages=await api('messages?chat_id='+encodeURIComponent(selected));renderContent();}}catch(e){$('error').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
function renderChats(){const q=$('search').value.toLowerCase();$('chats').innerHTML=chats.filter(c=>c.name.toLowerCase().includes(q)).map(c=>'<button class="chat '+(selected===c.chat_id?'active':'')+'" onclick="openChat(\''+esc(c.chat_id)+'\')"><span class="name">'+(c.unread_count?'<span class="unread">'+c.unread_count+'</span>':'')+esc(c.name)+'</span><small>'+(c.muted?'알림 꺼짐':c.can_draft?'업무 대화':'알림·보관 대화')+'</small></button>').join('');}
async function openChat(cid){selected=cid;messages=await api('messages?chat_id='+encodeURIComponent(cid));renderChats();renderContent();}
function renderCard(item){const id=item.chat_id;const editable=['draft','received','draft_error','stale','no_reply'].includes(item.status);const txt=edited[id]??item.draft??'';return '<article class="card"><div class="card-head"><h3>'+esc(item.name)+'</h3><span class="tag '+(item.status==='draft'?'green':'')+'">'+esc(labels[item.status]||item.status)+'</span></div>'+(item.message?'<div class="original">'+esc(item.message.text||'(텍스트가 아닌 메시지)')+'<div class="note">'+esc(item.message.sender)+' · '+time(item.message.sent_at)+'</div></div>':'')+'<p class="summary">'+esc(item.summary||'')+'</p>'+(editable?'<label class="label" for="draft-'+id+'">답장 초안 · 자유롭게 수정하세요</label><textarea id="draft-'+id+'" class="draft" maxlength="1500" oninput="edited[\''+id+'\']=this.value" placeholder="답장 내용을 입력하세요">'+esc(txt)+'</textarea>':item.draft?'<div class="original">'+esc(item.draft)+'</div>':'')+'<p class="note">'+esc(item.reason||'')+'</p><div class="actions"><button onclick="dismiss(\''+id+'\')">확인 완료</button><div>'+(editable?'<button onclick="requestDraft(\''+id+'\')">초안 다시 작성</button><button class="primary" onclick="prepareSend(\''+id+'\')">전송 전 확인</button>':'')+'</div></div></article>';}
function renderContent(){if(selected){const c=chats.find(c=>c.chat_id===selected);if(!c)return;const item=inbox.find(i=>i.chat_id===selected);$('content').innerHTML='<button class="back" onclick="selected=null;renderChats();renderContent()">← 받은 메시지</button><div class="chat-heading" style="margin-top:20px"><h2>'+esc(c.name)+'</h2><div><button onclick="mute(\''+selected+'\','+!c.muted+')">'+(c.muted?'알림 켜기':'알림 끄기')+'</button> '+(c.can_draft&&!c.muted?'<button class="primary" onclick="requestDraft(\''+selected+'\')">답장 초안 작성</button>':'')+'</div></div>'+(item&&item.status!=='dismissed'?renderCard(item):'')+'<div class="messages">'+messages.map(m=>'<div class="bubble '+(m.is_from_me?'mine':'')+'"><div class="who">'+esc(m.is_from_me?'나':m.sender)+' · '+time(m.sent_at)+'</div>'+esc(m.text||'(텍스트가 아닌 메시지)')+'</div>').join('')+'</div>';return;}
const active=inbox.filter(x=>!['dismissed','replied','no_reply'].includes(x.status));$('content').innerHTML='<div class="toolbar"><div><h2>받은 메시지</h2><span class="tag">'+active.length+'</span></div><button onclick="toggleAuto()">자동 초안 '+(status.draft_mode==='codex'?'Codex 연결':status.auto_draft?'켜짐':'꺼짐')+'</button></div>'+(!status.send_ready?'<p class="note">Codex 대화에서 초안 작성과 전송을 요청할 수 있습니다. 이 웹 화면에서 직접 보내려면 별도 전송 권한이 필요합니다.</p>':'')+(active.length?active.map(renderCard).join(''):'<div class="card empty"><span class="icon">✉</span><h2>새 업무 메시지를 기다리고 있습니다</h2><p>메시지가 도착하면 알리고, 연결된 '+(status.dots?.connected?'Dots':'Codex')+'가 답장 초안을 준비합니다.<br>기존 대화는 왼쪽에서 선택해 확인할 수 있습니다.</p><p class="note">맥·업무용 카카오톡·Codex 앱이 실행 중이어야 합니다.</p></div>');}
async function requestDraft(cid){if(status.dots?.connected){const c=chats.find(c=>c.chat_id===cid);toast('Dots에서 “'+(c?.name||'이 대화방')+' 답장 초안 작성해 줘”라고 요청해 주세요.');return;}if(status.draft_mode==='codex'){const c=chats.find(c=>c.chat_id===cid);toast('Codex에서 “'+(c?.name||'이 대화방')+' 답장 초안 작성해 줘”라고 요청해 주세요.');return;}try{await api('draft',{chat_id:cid});delete edited[cid];toast('최근 대화를 확인해 초안을 작성합니다.');await refresh();}catch(e){toast(e.message);}}
async function prepareSend(cid){try{const item=inbox.find(x=>x.chat_id===cid);const text=edited[cid]??$('draft-'+cid)?.value??item?.draft??'';prepared=await api('prepare',{chat_id:cid,text});$('confirmName').textContent='받는 사람: '+prepared.name;$('confirmText').textContent=prepared.text;$('confirmDialog').showModal();}catch(e){toast(e.message);}}
function cancelSend(){prepared=null;$('confirmDialog').close();}
async function confirmSend(){if(!prepared||busy)return;busy=true;$('sendFinal').disabled=true;try{const r=await api('confirm',{token:prepared.token,chat_id:prepared.chat_id,text:prepared.text});delete edited[prepared.chat_id];cancelSend();toast(r.message);}catch(e){cancelSend();toast(e.message);}finally{busy=false;$('sendFinal').disabled=false;await refresh();}}
async function dismiss(cid){await api('dismiss',{chat_id:cid});await refresh();}
async function togglePause(){await api('settings',{paused:!status.paused});await refresh();}
async function toggleAuto(){if(status.draft_mode==='codex'){toast('초안은 Codex 대화에서 작성합니다. 새 메시지 알림은 계속 동작합니다.');return;}await api('settings',{auto_draft:!status.auto_draft});await refresh();}
async function mute(cid,value){await api('settings',{muted_chat_id:cid,muted:value});await refresh();}
refresh();setInterval(refresh,5000);
</script></html>
